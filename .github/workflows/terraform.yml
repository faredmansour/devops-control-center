name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validation (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/terraform/test-lab
          - infra/terraform/test-lab-us-east-1
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Check root formatting
        run: terraform fmt -check -diff -recursive

      - name: Check shared module formatting
        run: terraform fmt -check -diff -recursive ../modules
      - name: Initialize without backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  security-groups-tests:
    name: Security Groups module tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/modules/security-groups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Check module formatting
        run: terraform fmt -check -diff -recursive
      - name: Initialize without backend
        run: terraform init -backend=false -input=false
      - name: Run mocked Security Groups tests
        run: terraform test -no-color

