name: Build and push DCC image to Test Lab ECR

on:
  workflow_dispatch:
  push:
    branches: [feat/test-lab-us-east-1-isolated]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/testlab-ecr.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dcc-testlab-ecr
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push DCC
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dcc-testlab-use1-dcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push DCC
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=dcc
          cache-to: type=gha,mode=max,scope=dcc

      - name: Print image reference
        run: echo "dcc_image_tag=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  configuration-required:
    name: AWS OIDC configuration required
    if: ${{ vars.AWS_ROLE_ARN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required repository variable
        run: |
          echo "Set repository variable AWS_ROLE_ARN to the IAM role ARN trusted for this repository via GitHub OIDC."
          echo "No image was built or pushed."
          exit 1
